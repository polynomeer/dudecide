name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Backend tests run on H2, so migrations are checked against the real database here.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: dudecide
          POSTGRES_USER: dudecide
          POSTGRES_PASSWORD: dudecide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dudecide -d dudecide"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The repository has no Gradle wrapper; keep this version in step with backend/app/Dockerfile.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.2"
      - name: Test
        run: gradle --no-daemon :backend:shared:test :backend:app:test :backend:worker:test
      - name: Apply migrations to PostgreSQL
        run: gradle --no-daemon :backend:app:flywayMigrate
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/*/build/reports/tests/
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/app/Dockerfile -t dudecide-api:ci .
      - name: Build web image
        run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid -t dudecide-web:ci apps/web
