services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: dudecide-postgres
    environment:
      POSTGRES_DB: dudecide
      POSTGRES_USER: dudecide
      POSTGRES_PASSWORD: dudecide
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dudecide-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dudecide -d dudecide"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.10-alpine
    container_name: dudecide-redis
    ports:
      - "6379:6379"
    volumes:
      - dudecide-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dudecide-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dudecide
      MINIO_ROOT_PASSWORD: dudecide123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dudecide-minio-data:/data

  # The built images, for trying a production-like stack: docker compose --profile app up --build postgres api web
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/app/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dudecide
      DB_USER: dudecide
      DB_PASSWORD: dudecide
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  dudecide-postgres-data:
  dudecide-redis-data:
  dudecide-minio-data:
