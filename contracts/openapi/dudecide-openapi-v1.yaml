openapi: 3.1.0
info:
  title: Dudecide API
  version: 0.1.0
  description: Draft MVP contract for meeting, decision, and vote flows.
servers:
  - url: /api/v1
paths:
  /meetings:
    post:
      operationId: createMeeting
      summary: Create a meeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingRequest'
      responses:
        '201':
          description: Meeting created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
  /meetings/{meetingId}:
    get:
      operationId: getMeeting
      summary: Get meeting summary and progress
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: Meeting detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingDetailResponse'
  /meetings/{meetingId}/invite-links:
    post:
      operationId: createInviteLink
      summary: Create an invite link
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteLinkRequest'
      responses:
        '201':
          description: Invite link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteLinkResponse'
  /invite-links/{token}/join:
    post:
      operationId: joinWithInvite
      summary: Join meeting via invite token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinInviteRequest'
      responses:
        '201':
          description: Membership created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
  /meetings/{meetingId}/members/{memberId}:
    patch:
      operationId: updateMembership
      summary: Update member role or attendance
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRequest'
      responses:
        '200':
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
  /meetings/{meetingId}/decisions:
    get:
      operationId: listDecisions
      summary: List decisions for a meeting
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: Decision list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DecisionResponse'
    post:
      operationId: createDecision
      summary: Create a manual decision draft
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDecisionRequest'
      responses:
        '201':
          description: Decision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
  /meetings/{meetingId}/votes:
    post:
      operationId: createVote
      summary: Create a vote and attach it to a decision
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoteRequest'
      responses:
        '200':
          description: Vote created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponseView'
  /meetings/{meetingId}/reports/latest:
    get:
      operationId: getLatestReport
      summary: Get the latest materialized report
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: Latest report snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingReportResponse'
  /meetings/{meetingId}/reports/refresh:
    post:
      operationId: refreshMeetingReport
      summary: Materialize a fresh meeting report snapshot
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '201':
          description: Report refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingReportResponse'
  /decisions/{decisionId}/confirm:
    post:
      operationId: confirmDecision
      summary: Confirm a decision
      parameters:
        - $ref: '#/components/parameters/DecisionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDecisionRequest'
      responses:
        '200':
          description: Decision confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
  /decisions/{decisionId}/reconsider:
    post:
      operationId: reconsiderDecision
      summary: Move a confirmed decision into reconsideration
      parameters:
        - $ref: '#/components/parameters/DecisionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconsiderDecisionRequest'
      responses:
        '200':
          description: Decision moved to reconsideration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
  /decisions/{decisionId}/evidence:
    post:
      operationId: addDecisionEvidence
      summary: Link a message as decision evidence
      parameters:
        - $ref: '#/components/parameters/DecisionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDecisionEvidenceRequest'
      responses:
        '201':
          description: Evidence linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionEvidenceView'
  /decisions/{decisionId}:
    get:
      operationId: getDecision
      summary: Get decision detail with evidence and history
      parameters:
        - $ref: '#/components/parameters/DecisionId'
      responses:
        '200':
          description: Decision detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionDetailResponse'
  /meetings/{meetingId}/threads:
    get:
      operationId: listThreads
      summary: List threads with badges and activity state
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: Thread list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThreadSummaryView'
    post:
      operationId: createThread
      summary: Create a thread
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
      responses:
        '201':
          description: Thread created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadSummaryView'
  /meetings/{meetingId}/search:
    get:
      operationId: searchMeeting
      summary: Search meeting messages, decisions, and tasks
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
  /meetings/{meetingId}/tasks:
    get:
      operationId: listTasks
      summary: List meeting tasks
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskView'
    post:
      operationId: createTask
      summary: Create a meeting task
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
  /meetings/{meetingId}/notifications:
    get:
      operationId: listNotifications
      summary: List notifications for the current meeting user
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationView'
  /meetings/{meetingId}/events:
    get:
      operationId: streamMeetingEvents
      summary: Open a meeting SSE stream
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: SSE stream opened
  /threads/{threadId}/messages:
    get:
      operationId: listMessages
      summary: List thread messages
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      responses:
        '200':
          description: Message list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageView'
    post:
      operationId: postMessage
      summary: Post a message
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageView'
        '422':
          description: Thread is read-only
  /messages/{messageId}:
    patch:
      operationId: updateMessage
      summary: Edit a message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageRequest'
      responses:
        '200':
          description: Message updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageView'
        '422':
          description: Imported messages cannot be edited
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      summary: Update a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
  /votes/{voteId}/responses/me:
    put:
      operationId: submitVoteResponses
      summary: Submit or replace current user vote responses
      parameters:
        - $ref: '#/components/parameters/VoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteSubmissionRequest'
      responses:
        '200':
          description: Vote updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponseView'
  /votes/{voteId}:
    get:
      operationId: getVote
      summary: Get vote detail and aggregated results
      parameters:
        - $ref: '#/components/parameters/VoteId'
      responses:
        '200':
          description: Vote detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponseView'
  /votes/{voteId}/close:
    post:
      operationId: closeVote
      summary: Close a vote and freeze aggregated results
      parameters:
        - $ref: '#/components/parameters/VoteId'
      responses:
        '200':
          description: Vote closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponseView'
components:
  parameters:
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VoteId:
      name: voteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateMeetingRequest:
      type: object
      required:
        - title
        - meetingType
      properties:
        title:
          type: string
        meetingType:
          type: string
        expectedHeadcount:
          type: integer
          minimum: 1
        originRegion:
          type: string
        budget:
          $ref: '#/components/schemas/BudgetRange'
    BudgetRange:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
    MeetingResponse:
      type: object
      required:
        - id
        - title
        - meetingType
        - status
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        meetingType:
          type: string
        status:
          $ref: '#/components/schemas/MeetingStatus'
    MeetingDetailResponse:
      type: object
      required:
        - id
        - title
        - meetingType
        - status
        - ownerUserId
        - memberCount
        - decisionCount
        - openVoteCount
        - threads
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        meetingType:
          type: string
        status:
          $ref: '#/components/schemas/MeetingStatus'
        originRegion:
          type: string
        expectedHeadcount:
          type: integer
        budget:
          $ref: '#/components/schemas/BudgetRange'
        ownerUserId:
          type: string
          format: uuid
        memberCount:
          type: integer
        decisionCount:
          type: integer
        openVoteCount:
          type: integer
        threads:
          type: array
          items:
            $ref: '#/components/schemas/ThreadSummaryView'
    CreateInviteLinkRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
    InviteLinkResponse:
      type: object
      required:
        - id
        - meetingId
        - token
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        meetingId:
          type: string
          format: uuid
        token:
          type: string
        status:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    JoinInviteRequest:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
    MembershipResponse:
      type: object
      required:
        - id
        - meetingId
        - userId
        - displayName
        - role
        - attendanceStatus
        - joinedAt
      properties:
        id:
          type: string
          format: uuid
        meetingId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
        attendanceStatus:
          type: string
        joinedAt:
          type: string
          format: date-time
    MeetingReportResponse:
      type: object
      required:
        - id
        - meetingId
        - version
        - snapshot
        - generatedAt
      properties:
        id:
          type: string
          format: uuid
        meetingId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        snapshot:
          type: object
          additionalProperties: true
        generatedAt:
          type: string
          format: date-time
    UpdateMembershipRequest:
      type: object
      properties:
        role:
          type: string
        attendanceStatus:
          type: string
    DecisionResponse:
      type: object
      required:
        - id
        - meetingId
        - threadId
        - decisionType
        - title
        - status
      properties:
        id:
          type: string
          format: uuid
        meetingId:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        decisionType:
          $ref: '#/components/schemas/DecisionType'
        title:
          type: string
        status:
          $ref: '#/components/schemas/DecisionStatus'
        proposedResult:
          type: object
          additionalProperties: true
        confirmedResult:
          type: object
          additionalProperties: true
        decidedAt:
          type: string
          format: date-time
    CreateDecisionRequest:
      type: object
      required:
        - threadId
        - decisionType
        - title
      properties:
        threadId:
          type: string
          format: uuid
        decisionType:
          $ref: '#/components/schemas/DecisionType'
        title:
          type: string
        proposedResult:
          type: object
          additionalProperties: true
    ReconsiderDecisionRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
    AddDecisionEvidenceRequest:
      type: object
      required:
        - messageId
        - evidenceType
      properties:
        messageId:
          type: string
          format: uuid
        evidenceType:
          type: string
        quoteSnapshot:
          type: string
        confidence:
          type: number
    DecisionDetailResponse:
      allOf:
        - $ref: '#/components/schemas/DecisionResponse'
        - type: object
          required:
            - evidence
            - history
          properties:
            evidence:
              type: array
              items:
                $ref: '#/components/schemas/DecisionEvidenceView'
            history:
              type: array
              items:
                $ref: '#/components/schemas/DecisionHistoryView'
    DecisionEvidenceView:
      type: object
      required:
        - id
        - messageId
        - threadId
        - evidenceType
        - quoteSnapshot
      properties:
        id:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        evidenceType:
          type: string
        quoteSnapshot:
          type: string
        confidence:
          type: number
        createdAt:
          type: string
          format: date-time
    DecisionHistoryView:
      type: object
      required:
        - id
        - action
      properties:
        id:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
        action:
          type: string
        reason:
          type: string
        beforeState:
          type: object
          additionalProperties: true
        afterState:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    ThreadSummaryView:
      type: object
      required:
        - id
        - category
        - title
        - status
        - sortOrder
        - messageCount
        - decisionCount
        - openVoteCount
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        title:
          type: string
        status:
          type: string
        sortOrder:
          type: integer
        lastActivityAt:
          type: string
          format: date-time
        messageCount:
          type: integer
        decisionCount:
          type: integer
        openVoteCount:
          type: integer
        readOnly:
          type: boolean
          description: Import threads are read-only and reject new messages.
    CreateThreadRequest:
      type: object
      required:
        - category
        - title
      properties:
        category:
          type: string
        title:
          type: string
    CreateMessageRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
        attachments:
          type: array
          items:
            type: object
            additionalProperties: true
    UpdateMessageRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
        attachments:
          type: array
          items:
            type: object
            additionalProperties: true
    MessageSpeakerView:
      type: object
      required:
        - displayName
        - pseudonymized
      properties:
        displayName:
          type: string
          description: Member display name, exported name (uploader only), or pseudonym.
        userId:
          type:
            - string
            - 'null'
          format: uuid
        importSpeakerId:
          type:
            - string
            - 'null'
          format: uuid
        pseudonymized:
          type: boolean
    MessageView:
      type: object
      required:
        - id
        - threadId
        - senderUserId
        - origin
        - speaker
        - body
        - attachments
        - aiLabels
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        senderUserId:
          type:
            - string
            - 'null'
          format: uuid
          description: Null for imported messages.
        origin:
          type: string
          enum:
            - native
            - imported
        speaker:
          $ref: '#/components/schemas/MessageSpeakerView'
        body:
          type: string
        attachments:
          type: array
          items:
            type: object
            additionalProperties: true
        aiLabels:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
    SearchResponse:
      type: object
      required:
        - meetingId
        - query
        - messages
        - decisions
        - tasks
      properties:
        meetingId:
          type: string
          format: uuid
        query:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SearchMessageView'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/SearchDecisionView'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskView'
    SearchMessageView:
      type: object
      required:
        - id
        - threadId
        - body
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    SearchDecisionView:
      type: object
      required:
        - id
        - threadId
        - title
        - status
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        ownerUserId:
          type: string
          format: uuid
        sourceMessageId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
        status:
          type: string
        ownerUserId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
    TaskView:
      type: object
      required:
        - id
        - meetingId
        - title
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        meetingId:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        sourceMessageId:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
        dueAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    NotificationView:
      type: object
      required:
        - id
        - meetingId
        - recipientUserId
        - type
        - payload
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        meetingId:
          type: string
          format: uuid
        recipientUserId:
          type: string
          format: uuid
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        sentAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ConfirmDecisionRequest:
      type: object
      required:
        - confirmedResult
      properties:
        confirmedResult:
          type: object
          additionalProperties: true
        reason:
          type: string
    CreateVoteRequest:
      type: object
      required:
        - threadId
        - title
        - voteType
        - options
      properties:
        threadId:
          type: string
          format: uuid
        decisionId:
          type: string
          format: uuid
        decisionType:
          $ref: '#/components/schemas/DecisionType'
        title:
          type: string
        voteType:
          type: string
          enum: [date_matrix, package_preference, binary_confirm]
        opensAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        options:
          type: array
          items:
            $ref: '#/components/schemas/CreateVoteOptionRequest'
    CreateVoteOptionRequest:
      type: object
      required:
        - optionType
        - label
      properties:
        optionType:
          type: string
        label:
          type: string
        payload:
          type: object
          additionalProperties: true
        sortOrder:
          type: integer
    VoteSubmissionRequest:
      type: object
      required:
        - responses
      properties:
        responses:
          type: array
          items:
            $ref: '#/components/schemas/VoteSubmissionItem'
    VoteSubmissionItem:
      type: object
      required:
        - optionId
        - responseValue
      properties:
        optionId:
          type: string
          format: uuid
        responseValue:
          $ref: '#/components/schemas/VoteResponseValue'
    VoteResponseView:
      type: object
      required:
        - voteId
        - meetingId
        - threadId
        - voteType
        - status
        - options
        - responses
      properties:
        voteId:
          type: string
          format: uuid
        meetingId:
          type: string
          format: uuid
        decisionId:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        voteType:
          type: string
        opensAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/VoteStatus'
        options:
          type: array
          items:
            $ref: '#/components/schemas/VoteOptionView'
        responses:
          type: array
          items:
            $ref: '#/components/schemas/VoteSubmissionItem'
        aggregates:
          $ref: '#/components/schemas/VoteAggregateView'
    VoteOptionView:
      type: object
      required:
        - id
        - optionType
        - label
        - payload
      properties:
        id:
          type: string
          format: uuid
        optionType:
          type: string
        label:
          type: string
        payload:
          type: object
          additionalProperties: true
    VoteAggregateView:
      type: object
      required:
        - totalParticipants
        - respondedParticipants
        - unresolvedParticipants
        - leadingOptionIds
        - options
      properties:
        totalParticipants:
          type: integer
        respondedParticipants:
          type: integer
        unresolvedParticipants:
          type: integer
        canEarlyClose:
          type: boolean
        leadingOptionIds:
          type: array
          items:
            type: string
            format: uuid
        options:
          type: array
          items:
            $ref: '#/components/schemas/VoteAggregateOptionView'
    VoteAggregateOptionView:
      type: object
      required:
        - optionId
        - label
        - counts
      properties:
        optionId:
          type: string
          format: uuid
        label:
          type: string
        counts:
          type: object
          additionalProperties:
            type: integer
        rawScore:
          type: number
        rank:
          type: integer
    MeetingStatus:
      type: string
      enum: [draft, active, finalizing, completed, archived]
    DecisionStatus:
      type: string
      enum: [proposed, in_discussion, voting, confirmed, on_hold, needs_reconsideration]
    DecisionType:
      type: string
      enum: [date, location, lodging, transport, budget, task, other]
    VoteStatus:
      type: string
      enum: [draft, open, closed, superseded]
    VoteResponseValue:
      type: string
      enum: [available, maybe, unavailable, good, okay, dislike, yes, no]
